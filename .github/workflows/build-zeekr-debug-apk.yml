name: Build Zeekr 007 GT APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-zeekr-debug-apk.yml'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'

permissions:
  contents: read

concurrency:
  group: zeekr-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required toolchain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep 15
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble GitHub debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/github/debug/*.apk)
          if [[ "${#apks[@]}" -eq 0 ]]; then echo 'No APK created' >&2; exit 1; fi
          sums='app/build/outputs/apk/github/debug/SHA256SUMS.txt'
          : > "$sums"
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk" >> "$sums"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeekr007GT_OpenHeadunit_APK
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/github/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
